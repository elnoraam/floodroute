services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: floodroute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - floodroute-postgres:/var/lib/postgresql/data
      - ./backend/migrations/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d floodroute"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: floodroute
      DB_USER: postgres
      DB_PASS: postgres
      DB_SSLMODE: disable
      JWT_SECRET: replace_with_strong_secret
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_EMAIL: superadmin@floodroute.local
      SUPERADMIN_PASSWORD: superadmin123
    volumes:
      - ./database:/app/database
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  floodroute-postgres:
