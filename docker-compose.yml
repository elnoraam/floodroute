services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: floodroute
      DB_USER: postgres
      DB_PASS: postgres
      DB_SSLMODE: disable
      JWT_SECRET: replace_with_strong_secret
      SUPERADMIN_USERNAME: superadmin
      SUPERADMIN_EMAIL: superadmin@floodroute.local
      SUPERADMIN_PASSWORD: superadmin123
    volumes:
      - ./database:/app/database
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8088:80"

  db:
      image: postgres:15-alpine
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: floodroute
      volumes:
        - postgres_data:/var/lib/postgresql/data
      ports:
        - "5432:5432"

volumes:
  postgres_data:
